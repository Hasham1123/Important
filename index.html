<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Important Question</title>
  <style>
    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #fdf6f0;
      margin: 0;
      overflow: hidden;
    }
    .container {
      text-align: center;
      position: relative;
      width: 100%;
      padding: 20px;
    }
    h1 {
      margin-bottom: 30px;
    }
    .button-container {
      position: relative;
      height: 60px;
    }
    button {
      padding: 12px 25px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
    }
    #yesBtn {
      background-color: #4caf50;
      color: white;
    }
    #yesBtn:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    #noBtn {
      background-color: #f44336;
      color: white;
      position: fixed;
      transition: all 0.3s ease;
    }
    .loading {
      display: none;
      margin-top: 20px;
      font-size: 16px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>"Everything's good between us, right?"</h1>
    <div class="button-container">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </div>
    <div class="loading" id="loadingMsg">Sending notification...</div>
  </div>

  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script>
    // Initialize EmailJS with your Public Key
    emailjs.init('WzJ6QvGlhWcycr27D');
    
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const loadingMsg = document.getElementById("loadingMsg");
    
    // Position the No button initially next to Yes button
    function positionNoButton() {
      const yesRect = yesBtn.getBoundingClientRect();
      noBtn.style.left = `${yesRect.right + 20}px`;
      noBtn.style.top = `${yesRect.top}px`;
    }
    
    positionNoButton();
    window.addEventListener('resize', positionNoButton);
    
    function moveButton() {
      const maxX = window.innerWidth - noBtn.offsetWidth - 10;
      const maxY = window.innerHeight - noBtn.offsetHeight - 10;
      
      const x = Math.random() * maxX;
      const y = Math.random() * maxY;
      
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    }
    
    // For desktop: mouseover
    noBtn.addEventListener("mouseover", moveButton);
    
    // For mobile: touchstart (fires before click on mobile)
    noBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      moveButton();
    });
    
    // Additional safety: prevent click entirely
    noBtn.addEventListener("click", (e) => {
      e.preventDefault();
      moveButton();
    });
    
    // For extra coverage on mobile
    noBtn.addEventListener("mousedown", (e) => {
      e.preventDefault();
      moveButton();
    });
    
    // Yes button - send email THEN redirect
    yesBtn.addEventListener("click", () => {
      // Disable button to prevent double-clicks
      yesBtn.disabled = true;
      yesBtn.textContent = 'Loading...';
      loadingMsg.style.display = 'block';
      
      console.log('Wait and dont get mad...');
      
      // Send email notification
      emailjs.send('service_tpgzsaq', 'template_0iqb4ga', {
        timestamp: new Date().toLocaleString(),
        user_agent: navigator.userAgent
      }).then(
        function(response) {
          console.log('✅ Email sent successfully!', response.status, response.text);
          
          // Wait a moment then redirect
          setTimeout(() => {
            window.location.href = "happy.html";
          }, 500);
        },
        function(error) {
          console.error('❌ Email failed:', error);
          
          // Still redirect even if email fails (optional - you can change this)
          alert('Notification may not have sent, but continuing anyway...');
          setTimeout(() => {
            window.location.href = "happy.html";
          }, 500);
        }
      );
    });
  </script>
</body>
</html>
