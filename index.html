<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Important Question</title>
  <style>
    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #fdf6f0;
      margin: 0;
      overflow: hidden;
    }
    .container {
      text-align: center;
      position: relative;
      width: 100%;
      padding: 20px;
    }
    h1 {
      margin-bottom: 30px;
    }
    .button-container {
      position: relative;
      height: 60px;
    }
    button {
      padding: 12px 25px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
    }
    #yesBtn {
      background-color: #4caf50;
      color: white;
    }
    #noBtn {
      background-color: #f44336;
      color: white;
      position: fixed;
      transition: all 0.3s ease;
    }
    #hiddenForm {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Everything's good between us, right?</h1>
    <div class="button-container">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </div>
  </div>

  <!-- Hidden form for sending emails -->
  <form id="hiddenForm" action="https://formsubmit.co/hashamkiani4@gmail.com" method="POST">
    <input type="hidden" name="_subject" id="emailSubject">
    <input type="hidden" name="message" id="emailMessage">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_template" value="box">
  </form>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const hiddenForm = document.getElementById("hiddenForm");
    const emailSubject = document.getElementById("emailSubject");
    const emailMessage = document.getElementById("emailMessage");
    
    // Function to send email notification
    function sendEmail(subject, message) {
      emailSubject.value = subject;
      emailMessage.value = message;
      
      // Create a temporary form to send without redirect
      const tempForm = document.createElement('form');
      tempForm.action = hiddenForm.action;
      tempForm.method = 'POST';
      tempForm.style.display = 'none';
      
      // Copy all hidden inputs
      const inputs = hiddenForm.querySelectorAll('input');
      inputs.forEach(input => {
        const newInput = document.createElement('input');
        newInput.type = 'hidden';
        newInput.name = input.name;
        newInput.value = input.value;
        tempForm.appendChild(newInput);
      });
      
      // Add to page, submit, and remove
      document.body.appendChild(tempForm);
      tempForm.submit();
      setTimeout(() => document.body.removeChild(tempForm), 100);
    }
    
    // Send notification when page loads
    window.addEventListener('load', () => {
      const now = new Date().toLocaleString();
      sendEmail(
        '🔔 Website Opened!', 
        `Someone opened your "Everything's good between us?" website at ${now}`
      );
    });
    
    // Position the No button initially next to Yes button
    function positionNoButton() {
      const yesRect = yesBtn.getBoundingClientRect();
      noBtn.style.left = `${yesRect.right + 20}px`;
      noBtn.style.top = `${yesRect.top}px`;
    }
    
    positionNoButton();
    window.addEventListener('resize', positionNoButton);
    
    let noAttempts = 0;
    
    function moveButton() {
      const maxX = window.innerWidth - noBtn.offsetWidth - 10;
      const maxY = window.innerHeight - noBtn.offsetHeight - 10;
      
      const x = Math.random() * maxX;
      const y = Math.random() * maxY;
      
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
      
      // Send email on first attempt to click No
      noAttempts++;
      if (noAttempts === 1) {
        const now = new Date().toLocaleString();
        sendEmail(
          '😢 They tried to click NO!', 
          `Someone tried to click the "No" button at ${now}. But don't worry, they can't actually click it! 😊`
        );
      }
    }
    
    // For desktop: mouseover
    noBtn.addEventListener("mouseover", moveButton);
    
    // For mobile: touchstart
    noBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      moveButton();
    });
    
    // Additional safety: prevent click entirely
    noBtn.addEventListener("click", (e) => {
      e.preventDefault();
      moveButton();
    });
    
    // For extra coverage on mobile
    noBtn.addEventListener("mousedown", (e) => {
      e.preventDefault();
      moveButton();
    });
    
    // Yes button - send notification and redirect
    yesBtn.addEventListener("click", () => {
      const now = new Date().toLocaleString();
      sendEmail(
        '💚 YES! Everything is good!', 
        `Someone clicked "Yes" at ${now}! 🎉💕`
      );
      
      // Small delay to ensure email sends before redirect
      setTimeout(() => {
        window.location.href = "happy.html";
      }, 1000);
    });
  </script>
</body>
</html>
